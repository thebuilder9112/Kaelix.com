<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>TechNova AI - Intelligent Chat Assistant</title>
    <script type="text/javascript">
      // GitHub Pages SPA 404 Redirect
      // Redirects 404 requests on GitHub Pages back to index.html with route path intact
      var pathSegmentsToKeep = 1; // 1 for subfolder repos (e.g., username.github.io/repo-name)

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
